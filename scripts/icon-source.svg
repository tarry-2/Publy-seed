<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 골드 배경 그라데이션 (밝은 골드 → 딥 골드) -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f9dd86"/>
      <stop offset="42%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#c28f2f"/>
    </linearGradient>
    <!-- 상단 광택 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 새싹 딥 그라데이션 (럭셔리 다크 브라운) -->
    <linearGradient id="sprout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a2e12"/>
      <stop offset="100%" stop-color="#211907"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a5a12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 라운드 스퀘어 골드 배경 (squircle 근사) -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#gold)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#gloss)"/>
  <!-- 얇은 이너 테두리 -->
  <rect x="26" y="26" width="972" height="972" rx="210" ry="210" fill="none" stroke="#fff3cf" stroke-opacity="0.5" stroke-width="5"/>

  <!-- 새싹 심볼 (줄기 + 잎 2장) -->
  <g filter="url(#soft)" fill="url(#sprout)">
    <!-- 줄기 -->
    <path d="M512 690
             C 500 560, 500 470, 512 372
             C 524 470, 524 560, 512 690 Z"/>
    <!-- 왼쪽 잎 -->
    <path d="M500 486
             C 430 372, 300 356, 232 372
             C 258 470, 360 524, 500 500 Z"/>
    <!-- 오른쪽 잎 -->
    <path d="M524 452
             C 590 320, 720 300, 792 318
             C 762 420, 656 480, 524 468 Z"/>
    <!-- 씨앗 점(잎 사이 포인트) -->
    <circle cx="512" cy="392" r="20"/>
  </g>

  <!-- 텍스트: 골든시드 -->
  <text x="512" y="836" text-anchor="middle"
        font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif"
        font-size="128" font-weight="800" letter-spacing="2"
        fill="#241a08">골든시드</text>
</svg>
