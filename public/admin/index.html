<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>골든시드 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  /* 다크(기본) — 기존보다 한 톤 밝게 */
  :root, :root.dark{
    --bg:#14121a; --panel:#201c2b; --panel2:#2a2539; --line:#39334a; --line2:#4a4360;
    --ink:#f6f1e6; --sub:#b0a894; --gold:#f7cd63; --gold2:#d4ad4a; --glow:rgba(247,205,99,.16);
    --good:#7dd88a; --warn:#f7cd63; --danger:#ff8a8a;
    --bgimg:radial-gradient(900px 500px at 12% -8%,#2a2110 0,transparent 55%),radial-gradient(700px 460px at 108% 6%,#221836 0,transparent 50%);
  }
  /* 라이트 */
  :root.light{
    --bg:#faf6ec; --panel:#fffdf7; --panel2:#f4eedd; --line:#e6dcc2; --line2:#d6c99e;
    --ink:#2a2010; --sub:#8a7a52; --gold:#b8860b; --gold2:#9a6f14; --glow:rgba(184,134,11,.12);
    --good:#059669; --warn:#b8860b; --danger:#dc2626;
    --bgimg:radial-gradient(900px 500px at 12% -8%,#fdf1cf 0,transparent 55%),radial-gradient(700px 460px at 108% 6%,#fbe9d4 0,transparent 50%);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    background-image:var(--bgimg);transition:background .2s,color .2s;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:920px;margin:0 auto;padding:16px 14px 60px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .sect{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .btn{padding:9px 15px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel2);color:var(--ink);
    font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
  .btn:hover{border-color:var(--gold);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#231a08;border:none;}
  .btn.danger{color:var(--danger);border-color:rgba(255,122,122,.4);}
  .btn.good{color:var(--good);border-color:rgba(125,216,138,.4);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  input{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:11px;background:var(--panel2);color:var(--ink);
    font-size:15px;font-family:inherit;outline:none;}
  input:focus{border-color:var(--gold);}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;border:1.5px solid var(--line2);
    background:var(--panel2);color:var(--sub);font-size:12px;font-weight:800;cursor:pointer;transition:all .12s;}
  .chip.on{background:var(--gold);color:#231a08;border-color:var(--gold);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:10px 0;}
  .tab{flex:1;min-width:90px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
    color:var(--sub);font-weight:800;font-size:13px;cursor:pointer;text-align:center;position:relative;}
  .tab.on{background:var(--glow);border-color:var(--gold);color:var(--gold);}
  .badge{position:absolute;top:-5px;right:-3px;background:var(--danger);color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:900;}
  .row{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;}
  .muted{color:var(--sub);font-size:12px;font-weight:600;}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:900;}
  /* 로그인 게이트 */
  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;
    background:var(--bg);background-image:var(--bgimg);}
  .logo{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;margin:0 auto 16px;
    background:linear-gradient(135deg,#f9dd86,#f5c451 55%,#c9a03f);box-shadow:0 12px 34px var(--glow);}
  .logo span{font-family:'Bebas Neue',Arial Black,sans-serif;font-size:42px;font-weight:900;color:#231a08;line-height:1;}
  @media(max-width:520px){ .wrap{padding:12px 11px 60px;} .tab{min-width:0;font-size:12px;padding:10px 6px;} }
</style>
</head>
<body>
<script>try{if(sessionStorage.getItem('gs_admin_token'))document.write('<style>#gate{display:none!important}</style>');}catch(e){}</script>

<!-- 로그인 게이트 -->
<div id="gate">
  <button class="btn sm" id="themeGate" style="position:absolute;top:16px;right:16px">🌙</button>
  <div style="width:100%;max-width:340px;text-align:center">
    <div class="logo"><span>C</span></div>
    <div style="font-size:20px;font-weight:900;margin-bottom:4px">골든시드 관리자</div>
    <div class="muted" style="margin-bottom:20px">Golden-Hour Seeding · Admin</div>
    <div style="position:relative;margin-bottom:10px">
      <input id="pw" type="password" placeholder="관리자 시크릿" autocomplete="current-password" style="padding-right:46px" />
      <span id="pwEye" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px">👁️</span>
    </div>
    <button class="btn gold" id="loginBtn" style="width:100%;padding:14px;font-size:15px">입장하기</button>
    <div id="err" style="color:var(--danger);font-size:12.5px;font-weight:700;margin-top:10px;min-height:16px"></div>
  </div>
</div>

<!-- 메인 -->
<div id="main" style="display:none">
  <div class="wrap">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div class="logo" style="width:34px;height:34px;border-radius:10px;margin:0"><span style="font-size:22px">C</span></div>
      <div style="font-size:16px;font-weight:900">골든시드 <small style="color:var(--sub);font-weight:600">관리자</small></div>
      <button class="btn sm" id="themeMain" style="margin-left:auto">🌙</button>
      <button class="btn sm" id="pwChg">🔑 비번</button>
      <button class="btn sm" id="logout">로그아웃</button>
    </div>

    <div class="tabs">
      <div class="tab on" data-pane="requests" id="tabReq">🔔 주문승인<span class="badge" id="reqBadge" style="display:none">0</span></div>
      <div class="tab" data-pane="members">👥 회원관리</div>
      <div class="tab" data-pane="issue">🎫 발급·연장</div>
    </div>

    <!-- 🔔 주문승인 -->
    <div class="pane" id="pane-requests">
      <div class="card">
        <div class="sect">🔔 회원 주문(결제요청)</div>
        <div class="muted" style="margin-bottom:10px">회원이 신청한 플랫폼·액션·등급·기간을 확인하고 승인/거절해요. 승인하면 그 회원 앱에 시딩 콘솔이 열려요.</div>
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <button class="chip on" data-filter="pending">대기중</button>
          <button class="chip" data-filter="approved">승인됨</button>
          <button class="chip" data-filter="rejected">거절됨</button>
          <button class="chip" data-filter="">전체</button>
        </div>
        <div id="reqList"><div class="muted">불러오는 중…</div></div>
      </div>
    </div>

    <!-- 👥 회원관리 -->
    <div class="pane" id="pane-members" style="display:none">
      <div class="card">
        <div class="sect">👥 회원 명단</div>
        <input id="memSearch" placeholder="이메일·이름 검색" style="margin-bottom:12px" />
        <div id="memList"><div class="muted">불러오는 중…</div></div>
      </div>
    </div>

    <!-- 🎫 발급·연장 -->
    <div class="pane" id="pane-issue" style="display:none">
      <div class="card">
        <div class="sect">🎫 시딩 발급 · 연장</div>
        <div class="muted" style="margin-bottom:10px">고객 이메일로 직접 발급하거나, 회원관리·주문승인에서 넘어와요.</div>
        <input id="issCustomer" placeholder="고객 이메일" style="margin-bottom:12px" />
        <div style="margin-bottom:12px">
          <div class="muted" style="margin-bottom:6px">플랫폼 · 액션 (승인할 것만 체크)</div>
          <div id="issTools"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <select id="issPlan" class="btn" style="flex:1">
            <option value="basic">베이직</option><option value="pro">프로</option>
            <option value="premium">프리미엄</option><option value="unlimited">무제한</option>
          </select>
          <select id="issDays" class="btn" style="flex:1">
            <option value="7">7일</option><option value="30" selected>30일</option>
            <option value="90">90일</option><option value="365">1년</option>
          </select>
        </div>
        <button class="btn gold" id="issBtn" style="width:100%;padding:13px">🎫 발급 · 연장하기</button>
        <div id="issMsg" style="font-size:12.5px;font-weight:700;margin-top:10px;min-height:15px"></div>
      </div>
    </div>
  </div>
</div>

<!-- 비번 변경 모달 -->
<div id="pwModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:100%;max-width:340px;margin:0">
    <div style="font-size:15px;font-weight:900;margin-bottom:12px">🔑 관리자 시크릿 변경</div>
    <input id="npw" type="password" placeholder="새 시크릿(4자 이상)" style="margin-bottom:9px" />
    <input id="npw2" type="password" placeholder="새 시크릿 확인" style="margin-bottom:12px" />
    <div style="display:flex;gap:8px">
      <button class="btn" id="pwCancel" style="flex:1">취소</button>
      <button class="btn gold" id="pwSave" style="flex:1">변경</button>
    </div>
    <div id="pwMsg" style="font-size:12px;font-weight:700;margin-top:9px;min-height:14px"></div>
  </div>
</div>

<script>
  const SB_URL='https://nnujeovecnmestvfoiqt.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5udWplb3ZlY25tZXN0dmZvaXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTY1OTEsImV4cCI6MjEwNDU5MjU5MX0.hpgSAFqATfQKDzccpz40eIRxHu64ONsojQ4dY73-Abg';
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const $=id=>document.getElementById(id);

  // ── 🌓 라이트/다크 테마(localStorage 저장, 기본 다크) ──
  function applyTheme(t){
    document.documentElement.classList.remove('light','dark');
    document.documentElement.classList.add(t);
    const icon = t==='dark' ? '☀️' : '🌙';
    ['themeGate','themeMain'].forEach(id=>{ const b=document.getElementById(id); if(b) b.textContent=icon; });
    try{ localStorage.setItem('gs_admin_theme', t); }catch(e){}
  }
  function toggleTheme(){ applyTheme(document.documentElement.classList.contains('light')?'dark':'light'); }
  (function(){ let t='dark'; try{ t=localStorage.getItem('gs_admin_theme')||'dark'; }catch(e){} applyTheme(t); })();
  ['themeGate','themeMain'].forEach(id=>{ const b=document.getElementById(id); if(b) b.onclick=toggleTheme; });

  // 플랫폼별 액션(회원 주문화면과 동일)
  const TOOLS={
    youtube:{label:'▶️ 유튜브', actions:[['view','조회'],['watch','시청'],['like','좋아요'],['comment','댓글'],['subscribe','구독'],['share','공유']]},
    instagram:{label:'📸 인스타', actions:[['view','조회'],['like','좋아요'],['comment','댓글'],['follow','팔로우'],['share','공유'],['repost','리포스트'],['save','저장']]},
  };
  const actLabel=(tool,key)=>{const a=(TOOLS[tool]?.actions||[]).find(x=>x[0]===key);return a?a[1]:key;};
  let TOKEN='';

  // ── 로그인 ──
  async function login(pw){
    const {data,error}=await sb.rpc('publy_admin_login',{p_password:pw});
    if(error||!data){ return {ok:false,msg:error?('오류: '+error.message):'시크릿이 맞지 않아요'}; }
    return {ok:true,token:data};
  }
  async function tryLogin(){
    const pw=$('pw').value;
    if(!pw){ $('err').textContent='시크릿을 입력하세요'; return; }
    $('err').textContent='확인 중…';
    const r=await login(pw);
    if(!r.ok){ $('err').textContent=r.msg; return; }
    TOKEN=r.token; try{sessionStorage.setItem('gs_admin_token',TOKEN);}catch(e){}
    $('err').textContent=''; openApp();
  }
  $('loginBtn').onclick=tryLogin;
  $('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
  $('pwEye').onclick=()=>{const i=$('pw');const s=i.type==='password';i.type=s?'text':'password';$('pwEye').textContent=s?'🙈':'👁️';};

  function openApp(){ $('gate').style.display='none'; $('main').style.display='block';
    buildIssTools(); loadReq(); loadMembers(); loadReqBadge(); setInterval(loadReqBadge,30000); }

  // 세션 자동 로그인(토큰 검증)
  (async()=>{
    try{ const t=sessionStorage.getItem('gs_admin_token');
      if(t){ const {data}=await sb.rpc('publy_admin_session_get',{p_token:t});
        if(data===true){ TOKEN=t; openApp(); return; } sessionStorage.removeItem('gs_admin_token'); }
    }catch(e){}
    $('gate').style.setProperty('display','flex','important'); $('pw').focus();
  })();

  $('logout').onclick=()=>{ try{sessionStorage.removeItem('gs_admin_token');}catch(e){} location.reload(); };

  // ── 탭 전환 ──
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
    document.querySelectorAll('.pane').forEach(p=>p.style.display='none');
    $('pane-'+t.dataset.pane).style.display='block';
    if(t.dataset.pane==='requests') loadReq();
    if(t.dataset.pane==='members') loadMembers();
  });

  // ── 🔔 주문승인 ──
  let reqFilter='pending';
  document.querySelectorAll('[data-filter]').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    reqFilter=c.dataset.filter; loadReq();
  });
  async function loadReqBadge(){
    if(!TOKEN)return;
    const {data}=await sb.rpc('admin_tool_requests_pending_count',{p_token:TOKEN});
    const b=$('reqBadge'); if(data>0){ b.style.display='inline-block'; b.textContent=data; } else b.style.display='none';
  }
  function payloadHtml(payload){
    if(!Array.isArray(payload)||!payload.length) return '<span class="muted">(내용 없음)</span>';
    return payload.map(p=>{
      const acts=(Array.isArray(p.actions)?p.actions:[]).map(a=>actLabel(p.tool,a)).join(', ')||'—';
      return '<div style="margin-top:6px"><b>'+(TOOLS[p.tool]?.label||p.tool)+'</b> · '+
        '<span class="muted">'+(p.plan||'basic')+' · '+(p.days||30)+'일</span><br>'+
        '<span style="font-size:12px;color:var(--gold)">'+acts+'</span></div>';
    }).join('');
  }
  async function loadReq(){
    if(!TOKEN)return;
    const {data,error}=await sb.rpc('admin_list_tool_requests',{p_token:TOKEN,p_status:reqFilter||null});
    const box=$('reqList');
    if(error){ box.innerHTML='<div class="muted">오류: '+error.message+'</div>'; return; }
    if(!data||!data.length){ box.innerHTML='<div class="muted">해당 주문이 없어요.</div>'; return; }
    box.innerHTML=data.map(r=>{
      const st=r.status==='approved'?['승인됨','var(--good)']:r.status==='rejected'?['거절됨','var(--danger)']:['⏳ 대기중','var(--warn)'];
      const when=new Date(r.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      return '<div class="row">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<b style="font-size:14px">'+(r.name||r.customer)+'</b>'+
          '<span class="pill" style="background:'+st[1]+'22;color:'+st[1]+'">'+st[0]+'</span>'+
          '<span class="muted" style="margin-left:auto">'+when+'</span></div>'+
        '<div class="muted" style="margin:2px 0 4px">'+r.customer+'</div>'+
        payloadHtml(r.payload)+
        (r.status==='pending'?
          '<div style="display:flex;gap:7px;margin-top:11px">'+
            '<button class="btn good sm" data-approve="'+r.id+'">✅ 승인</button>'+
            '<button class="btn danger sm" data-reject="'+r.id+'">거절</button>'+
            '<button class="btn sm" data-del="'+r.id+'" style="margin-left:auto">🗑</button></div>'
          :'<div style="display:flex;margin-top:9px"><button class="btn sm" data-del="'+r.id+'" style="margin-left:auto">🗑 삭제</button></div>')+
      '</div>';
    }).join('');
    box.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{
      if(!confirm('이 주문을 승인할까요?\n승인하면 그 회원에게 신청한 플랫폼·액션이 발급돼요.'))return;
      const {error}=await sb.rpc('admin_decide_tool_request',{p_token:TOKEN,p_id:b.dataset.approve,p_action:'approve',p_rows:null});
      if(error){alert('승인 실패: '+error.message);return;} loadReq(); loadReqBadge();
    });
    box.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{
      if(!confirm('이 주문을 거절할까요?'))return;
      const {error}=await sb.rpc('admin_decide_tool_request',{p_token:TOKEN,p_id:b.dataset.reject,p_action:'reject',p_rows:null});
      if(error){alert('실패: '+error.message);return;} loadReq(); loadReqBadge();
    });
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('이 주문 기록을 삭제할까요?'))return;
      const {error}=await sb.rpc('admin_decide_tool_request',{p_token:TOKEN,p_id:b.dataset.del,p_action:'delete',p_rows:null});
      if(error){alert('실패: '+error.message);return;} loadReq(); loadReqBadge();
    });
  }

  // ── 👥 회원관리 ──
  let memSearchTimer=null;
  $('memSearch').addEventListener('input',()=>{ clearTimeout(memSearchTimer); memSearchTimer=setTimeout(loadMembers,350); });
  async function loadMembers(){
    if(!TOKEN)return;
    const q=$('memSearch').value.trim();
    const {data,error}=await sb.rpc('admin_list_users',{p_token:TOKEN,p_search:q,p_offset:0,p_limit:100});
    const box=$('memList');
    if(error){ box.innerHTML='<div class="muted">오류: '+error.message+'</div>'; return; }
    if(!data||!data.length){ box.innerHTML='<div class="muted">회원이 없어요.</div>'; return; }
    box.innerHTML=data.map(m=>{
      const act=m.is_active;
      return '<div class="row">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<b>'+(m.name||'(이름없음)')+'</b>'+
          '<span class="pill" style="background:'+(act?'var(--good)22;color:var(--good)':'var(--danger)22;color:var(--danger)')+'">'+(act?'활성':'비활성')+'</span>'+
          '<span class="muted" style="margin-left:auto">'+(m.plan||'free')+'</span></div>'+
        '<div class="muted" style="margin:2px 0 8px">'+m.email+(m.phone?' · '+m.phone:'')+'</div>'+
        '<div style="display:flex;gap:7px;flex-wrap:wrap">'+
          '<button class="btn sm '+(act?'danger':'good')+'" data-active="'+m.id+'" data-next="'+(!act)+'">'+(act?'비활성화':'승인(활성화)')+'</button>'+
          '<button class="btn sm" data-issue="'+m.email+'">🎫 발급</button>'+
          '<button class="btn danger sm" data-revoke="'+m.email+'" style="margin-left:auto">전체 해지</button></div>'+
      '</div>';
    }).join('');
    box.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{
      const next=b.dataset.next==='true';
      if(!confirm(next?'이 회원을 승인(활성화)할까요?':'이 회원을 비활성화할까요?'))return;
      const {data,error}=await sb.rpc('admin_set_user_active',{p_token:TOKEN,p_user_id:b.dataset.active,p_active:next});
      if(error||data!==true){alert('실패'+(error?': '+error.message:''));return;} loadMembers();
    });
    box.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{
      $('issCustomer').value=b.dataset.issue;
      document.querySelector('[data-pane="issue"]').click();
    });
    box.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{
      if(!confirm('['+b.dataset.revoke+'] 모든 시딩 발급을 해지할까요?\n회원 계정은 유지돼요.'))return;
      const {error}=await sb.rpc('admin_delete_licenses',{p_token:TOKEN,p_customer:b.dataset.revoke,p_tool:null});
      if(error){alert('실패: '+error.message);return;} alert('해지 완료'); loadMembers();
    });
  }

  // ── 🎫 발급·연장 ──
  const issSel={youtube:new Set(),instagram:new Set()};
  function buildIssTools(){
    const box=$('issTools'); box.innerHTML='';
    Object.entries(TOOLS).forEach(([tool,t])=>{
      const wrap=document.createElement('div'); wrap.style.marginBottom='10px';
      wrap.innerHTML='<div style="font-size:13px;font-weight:800;margin-bottom:6px">'+t.label+'</div>';
      const chips=document.createElement('div'); chips.style.display='flex'; chips.style.flexWrap='wrap'; chips.style.gap='6px';
      t.actions.forEach(([k,lb])=>{
        const c=document.createElement('span'); c.className='chip'; c.textContent=lb;
        c.onclick=()=>{ issSel[tool].has(k)?issSel[tool].delete(k):issSel[tool].add(k); c.classList.toggle('on'); };
        chips.appendChild(c);
      });
      wrap.appendChild(chips); box.appendChild(wrap);
    });
  }
  $('issBtn').onclick=async()=>{
    const customer=$('issCustomer').value.trim();
    if(!customer){ $('issMsg').textContent='고객 이메일을 입력하세요'; $('issMsg').style.color='var(--danger)'; return; }
    const rows=[];
    Object.entries(issSel).forEach(([tool,set])=>{
      if(set.size) rows.push({customer,tool,plan:$('issPlan').value,allowed_actions:[...set],days:parseInt($('issDays').value)});
    });
    if(!rows.length){ $('issMsg').textContent='발급할 플랫폼·액션을 1개 이상 선택하세요'; $('issMsg').style.color='var(--danger)'; return; }
    const {error}=await sb.rpc('admin_upsert_licenses',{p_token:TOKEN,p_rows:rows});
    if(error){ $('issMsg').textContent='발급 실패: '+error.message; $('issMsg').style.color='var(--danger)'; return; }
    $('issMsg').textContent='✅ 발급 완료 ('+rows.length+'개 플랫폼)'; $('issMsg').style.color='var(--good)';
    issSel.youtube.clear(); issSel.instagram.clear(); buildIssTools();
  };

  // ── 🔑 비번 변경 ──
  $('pwChg').onclick=()=>$('pwModal').style.display='flex';
  $('pwCancel').onclick=()=>$('pwModal').style.display='none';
  $('pwSave').onclick=async()=>{
    const a=$('npw').value, b=$('npw2').value;
    if(a.length<4){ $('pwMsg').textContent='4자 이상'; $('pwMsg').style.color='var(--danger)'; return; }
    if(a!==b){ $('pwMsg').textContent='두 시크릿이 달라요'; $('pwMsg').style.color='var(--danger)'; return; }
    const {error}=await sb.rpc('publy_admin_change_password',{p_token:TOKEN,p_new_password:a});
    if(error){ $('pwMsg').textContent='실패: '+error.message; $('pwMsg').style.color='var(--danger)'; return; }
    $('pwModal').style.display='none'; alert('시크릿을 변경했어요. 다음 로그인부터 새 시크릿을 쓰세요.');
  };
</script>
</body>
</html>
